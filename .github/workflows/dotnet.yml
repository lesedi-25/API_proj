
name: RaceDay API CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore API_proj.sln

      - name: Build solution
        run: dotnet build API_proj.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test API_proj.sln --configuration Release --no-build
